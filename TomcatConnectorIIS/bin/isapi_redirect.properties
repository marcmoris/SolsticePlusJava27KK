# Configuration file for the Apache Tomcat Connector for IIS

# The path to the ISAPI Redirector Extension, relative to the website
# This must be in a virtual directory with execute privileges
extension_uri=/tomcatconnectoriis/isapi_redirect.dll

# Full path to the log file for the ISAPI Redirector
log_file=C:\Program Files\TomcatConnectorIIS\log\isapi_redirect.log

# Log level (debug, info, warn, error or trace)
log_level=info
log_filesize=10M

# Full path to the workers.properties file
#worker_file=C:\Program Files\TomcatConnectorIIS\conf\workers.properties.minimal
worker_file=C:\Program Files\TomcatConnectorIIS\conf\workers.properties

# Full path to the uriworkermap.properties file
worker_mount_file=C:\Program Files\TomcatConnectorIIS\conf\uriworkermap.properties
